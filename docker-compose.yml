services:
  database:
    image: mysql:8.0
    container_name: geonames-db
    restart: unless-stopped
    labels:
      - keep=true  # exempt from the host's docker-prune timer (filter label!=keep)
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geonames
      MYSQL_USER: geonames
      MYSQL_PASSWORD: geonames
    ports:
      - "3309:3306"
    volumes:
      - geonames_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --local-infile=1
      --secure-file-priv=/var/lib/mysql-files

  app:
    build: .
    container_name: geonames-app
    restart: unless-stopped
    labels:
      - keep=true
    ports:
      - "8082:80"
    depends_on:
      - database
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: geonames
      DB_USER: geonames
      DB_PASS: geonames
      CORS_ORIGIN: "*"
      API_KEY: ""  # Set to enable API key protection (e.g. API_KEY=my-secret-key)
      CACHE_TTL: "${CACHE_TTL:-0}"          # APCu cache TTL in seconds (0 = disabled)
      HTTP_CACHE_TTL: "${HTTP_CACHE_TTL:-0}" # Cache-Control max-age in seconds (0 = disabled)

  # Reverse proxy to production — bypasses the local DB.
  # Off by default (profile "proxy"); start on demand via ./scripts/proxy-prod
  # or: docker compose --profile proxy up proxy
  proxy:
    image: caddy:2-alpine
    container_name: geonames-proxy
    profiles: ["proxy"]
    ports:
      - "${PROXY_PORT:-8082}:80"
    # --change-host-header sets Host + TLS SNI to the upstream vhost.
    command: >
      caddy reverse-proxy
      --from :80
      --to ${PROXY_UPSTREAM:-https://geonames.example.com}
      --change-host-header

networks:
  default:
    labels:
      keep: "true"

volumes:
  geonames_data:
