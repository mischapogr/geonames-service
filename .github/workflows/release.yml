name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  # @semantic-release/github comments on the issues and pull requests a release closes
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          # Without this, every run installs the newest semantic-release, a new major included.
          # Dependabot does not update it; raise it by hand after reading the release notes.
          semantic_version: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
