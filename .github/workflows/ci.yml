name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PHP syntax on every supported version
        run: |
          for v in 8.1 8.2 8.3 8.4 8.5; do
            echo "PHP $v"
            docker run --rm -v "$GITHUB_WORKSPACE:/app:ro" -w /app "php:$v-cli" \
              sh -c 'for f in src/*.php tests/bench/*.php; do php -l "$f" || exit 1; done'
          done
      - name: Shell scripts
        run: >-
          git ls-files scripts tests/bench deploy.example | xargs grep -l -E '^#!.*(ba)?sh' |
          xargs docker run --rm -v "$GITHUB_WORKSPACE:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0 -x -S warning
      - name: GitHub Actions workflows
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12 -color

  e2e:
    name: End-to-end suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with "Supported PHP versions" in README.md.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build database app
      - name: Check the app runs the PHP version under test
        run: docker compose exec -T app php -r 'echo PHP_VERSION, PHP_EOL;' | grep -E "^${PHP_VERSION}\."
      - name: Wait for the database
        # Queries over TCP only succeed on the final server, which MySQL starts
        # after every migration in docker-entrypoint-initdb.d has run.
        run: |
          for _ in $(seq 1 90); do
            if docker compose exec -T database mysql -h 127.0.0.1 -ugeonames -pgeonames geonames -sN \
                -e "SELECT COUNT(*) FROM information_schema.COLUMNS
                    WHERE TABLE_SCHEMA = 'geonames' AND TABLE_NAME = 'cityinfo'
                    AND COLUMN_NAME = 'feature_code'" 2>/dev/null | grep -qx 1; then
              exit 0
            fi
            sleep 2
          done
          echo "The database did not finish its migrations" >&2
          exit 1
      - name: Import the cities15000 dataset
        run: |
          ./scripts/download-cities15000
          echo y | ./scripts/import-cities15000
      - name: Install PHPUnit
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2
          install --no-interaction --no-progress
      - name: Run the end-to-end suite
        # The suite talks HTTP, so the runner's PHP (8.3, for PHPUnit 11) is
        # independent of the server PHP under test.
        run: >-
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/app" -w /app php:8.3-cli
          php vendor/bin/phpunit --do-not-cache-result
      - name: No PHP warnings or deprecations in the app log
        run: |
          if docker compose logs app | grep -i -E 'PHP (warning|deprecated|notice|fatal)'; then
            exit 1
          fi
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200 database app
      - name: Tear down
        if: always()
        run: docker compose down -v
